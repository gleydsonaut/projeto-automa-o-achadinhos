<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>OfertaLab</title><link rel="stylesheet" href="popup.css"></head><body><h1>OfertaLab</h1><p>Abra uma página de produtos da Shopee, Mercado Livre ou Amazon.</p><label>Servidor local<input id="server" value="http://127.0.0.1:3138"></label><label>Chave de importação<input id="token" type="password" autocomplete="off"></label><label>Categoria<input id="category" placeholder="Casa, beleza…"></label><label>ID da lista (opcional)<input id="listId" placeholder="Copie da tela de listas"></label><label>Link afiliado (opcional, para um produto)<input id="affiliateUrl" type="url"></label><button id="scan">Ler produtos desta página</button><label><input id="all" type="checkbox"> Selecionar todos</label><div id="products"></div><button id="send" disabled>Importar selecionados</button><p id="status" role="status"></p><script type="module" src="popup.js"></script></body></html>
